<style>
  :root{
    --bg:#0b0a0d; --parchment:#e9e3d3; --muted:#a89d8a;
    --border:#2c241c; --gold:#c9a24b; --gold-dim:rgba(201,162,75,.38);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--parchment);
    font-family:Georgia,"Times New Roman",serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:4.5rem 4vw 3rem; line-height:1.5;
  }
  .sello{ height:88px; width:auto; margin-bottom:1.1rem; }
  .wordmark{ font-size:clamp(1.7rem,4vw,2.7rem); font-variant:small-caps; letter-spacing:.05em; font-weight:700; text-align:center; }
  .wordmark .accent{ color:var(--gold); }
  .tagline{ color:var(--muted); font-style:italic; margin-top:.6rem; font-size:.92rem; text-align:center; }
  .filete{ width:min(60%,360px); height:1px; margin:1.8rem auto 2.4rem; background:linear-gradient(90deg,transparent,var(--gold-dim) 20%,var(--gold) 50%,var(--gold-dim) 80%,transparent); }
  .setlist{
    margin-top:2.4rem; width:min(92%,460px);
    border:1px solid var(--border); padding:2rem 2.2rem;
    background:rgba(233,227,211,0.02);
  }
  .lista{ list-style:none; counter-reset:pista; }
  .curso{
    counter-increment:pista;
    display:flex; align-items:baseline; gap:0.7rem;
    font-family:Consolas,"Courier New",monospace;
    font-size:0.98rem; letter-spacing:.01em;
    text-decoration:none; color:var(--parchment);
    padding:0.45rem 0;
    border-bottom:1px dashed var(--border);
  }
  .lista li:last-child .curso{ border-bottom:none; }
  .curso::before{
    content:counter(pista) ".";
    color:var(--gold); min-width:1.4rem; flex-shrink:0;
  }
  .curso .album{ font-size:.76rem; font-style:italic; margin-left:auto; opacity:.75; white-space:nowrap; }
  .curso.bloqueado{ opacity:.2; cursor:default; }
  .curso.activo{ font-weight:700; }
  .curso.activo::before{ content:counter(pista) ". ▸"; }
  .curso.activo:hover{ color:var(--gold); }
  footer{ margin-top:3rem; color:var(--muted); font-size:.68rem; font-style:italic; text-align:center; }
</style>
</head>
