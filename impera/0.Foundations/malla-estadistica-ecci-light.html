<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malla Curricular · Estadística ECCI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #ffffff;
    --surface:   #f8f9fa;
    --surface2:  #eff1f5;
    --border:    rgba(0,0,0,0.08);
    --border2:   rgba(0,0,0,0.13);
    --text:      #1a1d23;
    --text2:     #5a6370;
    --text3:     #9aa3b0;
    --cb: #3d8ef0;
    --bp: #4fc3a1;
    --ap: #a78bfa;
    --sc: #f59e0b;
    --select:  #f59e0b;
    --prereq:  #ef4444;
    --unlock:  #0ea5e9;
    --card-w: 148px;
    --card-h: 90px;
    --gap-x:  18px;
    --col-w:  164px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  header {
    background: #fafbfc;
    border-bottom: 1px solid var(--border2);
    padding: 16px 28px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase; color: #111;
  }
  .brand-sub { font-size: 11px; color: var(--text2); letter-spacing: 0.06em; }
  .header-right { display: flex; align-items: center; gap: 20px; }
  .legend { display: flex; gap: 14px; align-items: center; }
  .legend-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; color: var(--text2); letter-spacing: 0.08em;
    text-transform: uppercase; font-family: 'JetBrains Mono', monospace;
    cursor: pointer; transition: color 0.2s;
  }
  .legend-item:hover { color: var(--text); }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .legend-dot.cb { background: var(--cb); }
  .legend-dot.bp { background: var(--bp); }
  .legend-dot.ap { background: var(--ap); }
  .legend-dot.sc { background: var(--sc); }
  .search-wrap { position: relative; }
  .search-input {
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 8px; color: var(--text);
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    padding: 6px 10px 6px 30px; width: 180px; outline: none;
    transition: border-color 0.2s, width 0.3s;
  }
  .search-input:focus { border-color: var(--select); width: 220px; }
  .search-icon {
    position: absolute; left: 9px; top: 50%;
    transform: translateY(-50%); color: var(--text3); font-size: 12px; pointer-events: none;
  }
  .credits-total {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text2); background: var(--surface2);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 10px; white-space: nowrap;
  }
  .credits-total span { color: var(--select); font-weight: 700; }
  .grid-outer {
    overflow-x: auto; overflow-y: visible;
    padding: 28px 28px 80px; position: relative;
  }
  #arrows-svg {
    position: absolute; top: 0; left: 0;
    pointer-events: none; z-index: 10; overflow: visible;
  }
  .semester-grid {
    display: flex; gap: var(--gap-x);
    align-items: flex-start; width: max-content; position: relative;
  }
  .sem-col { display: flex; flex-direction: column; gap: 6px; width: var(--col-w); }
  .sem-header {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--text3);
    padding: 0 0 8px 4px; border-bottom: 1px solid var(--border);
    margin-bottom: 4px; display: flex; justify-content: space-between; align-items: baseline;
  }
  .sem-credits { font-size: 9px; color: var(--text3); font-weight: 400; }
  .course-card {
    position: relative; width: var(--card-w); min-height: var(--card-h);
    background: var(--surface); border: 1.5px solid var(--border2);
    border-radius: 10px; padding: 10px 11px; cursor: pointer;
    transition: border-color 0.18s, background 0.18s, transform 0.15s, box-shadow 0.18s;
    user-select: none; display: flex; flex-direction: column; gap: 5px;
  }
  .course-card::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 3px; height: 100%; border-radius: 10px 0 0 10px;
    background: var(--field-color, var(--border2));
  }
  .course-card:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,0.09); }
  .course-card.selected {
    border-color: var(--select);
    background: rgba(245,158,11,0.07);
    box-shadow: 0 0 0 1px var(--select), 0 4px 14px rgba(245,158,11,0.12);
  }
  .course-card.prereq-of { border-color: var(--prereq); background: rgba(239,68,68,0.05); }
  .course-card.unlocks   { border-color: var(--unlock); background: rgba(14,165,233,0.05); }
  .course-card.dimmed    { opacity: 0.2; }
  .course-card.searched  { border-color: var(--select); box-shadow: 0 0 0 1px var(--select); }
  .card-code {
    font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700;
    letter-spacing: 0.14em; color: var(--field-color, var(--text3)); text-transform: uppercase;
  }
  .card-name { font-size: 11px; font-weight: 500; line-height: 1.35; color: var(--text); flex: 1; }
  .card-footer {
    display: flex; gap: 6px; align-items: center; justify-content: space-between;
    font-size: 9px; margin-top: auto;
  }
  .card-credits { color: var(--text3); font-weight: 500; }
  .card-field-badge {
    font-family: 'JetBrains Mono', monospace; font-size: 8px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    padding: 1px 5px; border-radius: 4px; color: white;
  }
  .field-cb { --field-color: var(--cb); }
  .field-bp { --field-color: var(--bp); }
  .field-ap { --field-color: var(--ap); }
  .field-sc { --field-color: var(--sc); }
  .badge-cb { background: var(--cb); }
  .badge-bp { background: var(--bp); }
  .badge-ap { background: var(--ap); }
  .badge-sc { background: var(--sc); }
  .arrow-line {
    fill: none; stroke: rgba(0,0,0,0.07); stroke-width: 1.2;
    transition: stroke 0.25s, opacity 0.25s;
  }
  .arrow-line.prereq-line { stroke: var(--prereq); opacity: 1; }
  .arrow-line.unlock-line { stroke: var(--unlock); opacity: 1; }
  .arrow-line.hidden-line { stroke: rgba(0,0,0,0.02); }
  #info-panel {
    position: fixed; right: -380px; top: 0; width: 360px; height: 100vh;
    background: var(--surface); border-left: 1px solid var(--border2);
    padding: 20px; overflow-y: auto;
    transition: right 0.35s cubic-bezier(0.16,1,0.3,1); z-index: 50;
    display: flex; flex-direction: column; gap: 18px;
  }
  #info-panel.visible { right: 0; }
  .panel-title {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--text3); margin-bottom: 8px;
  }
  #p-code { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; letter-spacing: 0.08em; }
  #p-name { font-size: 15px; font-weight: 500; line-height: 1.4; }
  #p-meta { display: flex; flex-direction: column; gap: 8px; }
  .meta-chip {
    display: inline-flex; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; font-size: 11px; color: var(--text2);
    font-family: 'JetBrains Mono', monospace; letter-spacing: 0.04em; width: fit-content;
  }
  .pills-section { display: flex; flex-direction: column; gap: 10px; }
  #p-prereqs, #p-unlocks { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    display: inline-flex; align-items: center; padding: 5px 10px; border-radius: 6px;
    font-size: 10px; font-weight: 600; font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.06em; cursor: pointer; user-select: none;
    transition: transform 0.1s;
  }
  .pill.pre { background: rgba(239,68,68,0.08); color: #dc2626; border: 1px solid rgba(239,68,68,0.25); }
  .pill.pre:hover { background: rgba(239,68,68,0.14); transform: scale(1.05); }
  .pill.unl { background: rgba(14,165,233,0.08); color: #0369a1; border: 1px solid rgba(14,165,233,0.25); }
  .pill.unl:hover { background: rgba(14,165,233,0.14); transform: scale(1.05); }
  .pill.none { background: var(--surface2); color: var(--text3); border: none; cursor: default; }
  .logo-watermark {
    position: fixed; bottom: 20px; right: 20px;
    width: 110px; height: 110px; opacity: 0.13;
    pointer-events: none; z-index: 5;
  }
</style>
</head>

<header>
  <div class="brand">
    <div class="brand-title">MALLA ESTADÍSTICA</div>
    <div class="brand-sub">Universidad ECCI · Plan 2024-1</div>
  </div>

    <div class="credits-total"><span>153</span> créditos totales</div>

</header>

<div class="grid-outer" id="grid-outer">

</div>

<div id="info-panel">

  <div><div class="panel-title">Materia</div><div id="p-name"></div></div>
  <div><div class="panel-title">Información</div><div id="p-meta"></div></div>
  <div class="pills-section">

    <div><div class="panel-title">Desbloquea</div><div id="p-unlocks"></div></div>

</div>

  { id:'MODLIN', name:'Modelos lineales generalizados',         credits:3, sem:7, field:'AP', pre1:'REGRES', pre2:null    },

  { id:'EBAYES', name:'Estadística Bayesiana',                  credits:4, sem:8, field:'AP', pre1:'INFERN', pre2:null    },
  { id:'FRPROY', name:'Formulación y Gestión de Proyectos',    credits:4, sem:8, field:'AP', pre1:'MODLIN', pre2:null    },
  { id:'ELECF3', name:'Electiva de formación III',              credits:4, sem:8, field:'AP', pre1:'REGRES', pre2:null    },
  { id:'VIINVA', name:'Investigación aplicada',                 credits:2, sem:8, field:'SC', pre1:'VIDDII', pre2:null    },
  // Semestre 9
  { id:'SEMINR', name:'Seminario',                              credits:2, sem:9, field:'AP', pre1:'FRPROY', pre2:null    },
  { id:'OGRADO', name:'Opción de Grado',                        credits:8, sem:9, field:'AP', pre1:null,     pre2:null    },
  { id:'CONSUL', name:'Consultoría Estadística',                credits:3, sem:9, field:'AP', pre1:'MODLIN', pre2:null    },
  { id:'ELECF4', name:'Electiva de formación IV',               credits:4, sem:9, field:'AP', pre1:'REGRES', pre2:null    },
];

const FIELD_NAMES  = { CB:'Ciencias Básicas', BP:'Básicas del Programa', AP:'Aplicadas', SC:'Socioculturales' };
const FIELD_COLORS = { CB:'#3d8ef0', BP:'#4fc3a1', AP:'#a78bfa', SC:'#f59e0b' };
const SEM_NAMES    = { 1:'Primero',2:'Segundo',3:'Tercero',4:'Cuarto',5:'Quinto',6:'Sexto',7:'Séptimo',8:'Octavo',9:'Noveno' };

const courseMap = {};
const unlocksMap = {};
let selected = null, activeFilter = null;

COURSES.forEach(c => {
  courseMap[c.id] = c;
  [c.pre1, c.pre2].forEach(p => {
    if (p) { if (!unlocksMap[p]) unlocksMap[p] = []; unlocksMap[p].push(c.id); }
  });
});

// Build grid
const bySem = {};
for (let i=1;i<=9;i++) bySem[i]=[];
COURSES.forEach(c => bySem[c.sem].push(c));

const grid = document.getElementById('semester-grid');
for (let s=1;s<=9;s++) {
  const semCreds = bySem[s].reduce((a,c)=>a+c.credits,0);
  const col = document.createElement('div');
  col.className='sem-col';
  col.innerHTML=`<div class="sem-header">S${String(s).padStart(2,'0')} <span class="sem-credits">${semCreds} cr</span></div>`;
  bySem[s].forEach(course => {
    const card = document.createElement('div');
    card.className=`course-card field-${course.field.toLowerCase()}`;
    card.id=`card-${course.id}`;
    card.dataset.id=course.id;
    card.dataset.field=course.field;
    card.innerHTML=`
      <div class="card-code">${course.id}</div>
      <div class="card-name">${course.name}</div>
      <div class="card-footer">
        <span class="card-credits">${course.credits} cr</span>
        <span class="card-field-badge badge-${course.field.toLowerCase()}">${course.field}</span>
      </div>`;
    card.addEventListener('click',()=>selectCourse(course.id));
    col.appendChild(card);
  });
  grid.appendChild(col);
}

// SVG arrows
const svg = document.getElementById('arrows-svg');
const outer = document.getElementById('grid-outer');
svg.innerHTML=`<defs>
  <marker id="ah-default" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="rgba(0,0,0,0.1)"/></marker>
  <marker id="ah-prereq"  markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/></marker>
  <marker id="ah-unlock"  markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0ea5e9"/></marker>
</defs>`;

const pathMap = {};
function getCardCenter(id, side) {
  const el=document.getElementById(`card-${id}`);
  if(!el) return null;
  const or=outer.getBoundingClientRect(), r=el.getBoundingClientRect();
  return {
    x: (side==='right'?r.right:r.left)-or.left+outer.scrollLeft,
    y: r.top+r.height/2-or.top+outer.scrollTop
  };
}
function cubicPath(x1,y1,x2,y2){const cx=(x1+x2)/2;return `M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`;}

function drawAllArrows() {
  svg.querySelectorAll('path,line').forEach(p=>p.remove());
  Object.keys(pathMap).forEach(k=>delete pathMap[k]);
  svg.setAttribute('width', outer.scrollWidth);
  svg.setAttribute('height', outer.scrollHeight);
  COURSES.forEach(course => {
    [course.pre1, course.pre2].forEach(preId => {
      if(!preId||!courseMap[preId]) return;
      const key=`${preId}-${course.id}`;
      if(pathMap[key]) return;
      const from=getCardCenter(preId,'right'), to=getCardCenter(course.id,'left');
      if(!from||!to) return;
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d', cubicPath(from.x,from.y,to.x,to.y));
      path.setAttribute('class','arrow-line');
      path.setAttribute('marker-end','url(#ah-default)');
      path.dataset.from=preId; path.dataset.to=course.id;
      svg.appendChild(path); pathMap[key]=path;
    });
  });
}
let drawTimer=null;
function scheduleDraw(){clearTimeout(drawTimer);drawTimer=setTimeout(drawAllArrows,60);}
window.addEventListener('resize',scheduleDraw);
outer.addEventListener('scroll',scheduleDraw);
requestAnimationFrame(scheduleDraw);
setTimeout(drawAllArrows,300);

function selectCourse(id) {
  if(selected===id){clearSelection();return;}
  selected=id;
  const course=courseMap[id];
  const prereqs=[course.pre1,course.pre2].filter(Boolean).filter(p=>courseMap[p]);
  const unlocks=(unlocksMap[id]||[]).filter(p=>courseMap[p]);
  document.querySelectorAll('.course-card').forEach(card=>{
    const cid=card.dataset.id;
    card.classList.remove('selected','prereq-of','unlocks','dimmed');
    if(cid===id) card.classList.add('selected');
    else if(prereqs.includes(cid)) card.classList.add('prereq-of');
    else if(unlocks.includes(cid)) card.classList.add('unlocks');
    else card.classList.add('dimmed');
  });
  Object.entries(pathMap).forEach(([key,path])=>{
    const from=path.dataset.from, to=path.dataset.to;
    path.classList.remove('prereq-line','unlock-line','hidden-line');
    if(to===id){path.classList.add('prereq-line');path.setAttribute('marker-end','url(#ah-prereq)');}
    else if(from===id){path.classList.add('unlock-line');path.setAttribute('marker-end','url(#ah-unlock)');}
    else path.classList.add('hidden-line');
  });
  showPanel(course,prereqs,unlocks);
}

function clearSelection() {
  selected=null;
  document.querySelectorAll('.course-card').forEach(c=>c.classList.remove('selected','prereq-of','unlocks','dimmed'));
  Object.values(pathMap).forEach(p=>{p.classList.remove('prereq-line','unlock-line','hidden-line');p.setAttribute('marker-end','url(#ah-default)');});
  document.getElementById('info-panel').classList.remove('visible');
  if(activeFilter) filterField(activeFilter);
}

function showPanel(course,prereqs,unlocks) {
  const color=FIELD_COLORS[course.field];
  document.getElementById('p-code').textContent=course.id;
  document.getElementById('p-code').style.color=color;
  document.getElementById('p-name').textContent=course.name;
  document.getElementById('p-meta').innerHTML=`
    <span class="meta-chip">Semestre ${course.sem} · ${SEM_NAMES[course.sem]}</span>
    <span class="meta-chip">${course.credits} créditos</span>
    <span class="meta-chip" style="color:${color}">${FIELD_NAMES[course.field]}</span>`;
  document.getElementById('p-prereqs').innerHTML=prereqs.length
    ? prereqs.map(pid=>`<span class="pill pre" onclick="selectCourse('${pid}')">${pid}</span>`).join('')
    : '<span class="pill none">Sin prerrequisitos</span>';
  document.getElementById('p-unlocks').innerHTML=unlocks.length
    ? unlocks.map(uid=>`<span class="pill unl" onclick="selectCourse('${uid}')">${uid}</span>`).join('')
    : '<span class="pill none">Ninguna materia depende de esta</span>';
  document.getElementById('info-panel').classList.add('visible');
}

function filterField(field) {
  if(field===activeFilter) field=null;
  activeFilter=field;
  clearSelection();
  document.querySelectorAll('.course-card').forEach(card=>{
    card.classList.remove('dimmed');
    if(field&&card.dataset.field!==field) card.classList.add('dimmed');
  });
  Object.values(pathMap).forEach(path=>{
    path.classList.remove('prereq-line','unlock-line','hidden-line');
    path.setAttribute('marker-end','url(#ah-default)');
    if(field){
      const ff=courseMap[path.dataset.from]?.field, tf=courseMap[path.dataset.to]?.field;
      if(ff!==field&&tf!==field) path.classList.add('hidden-line');
    }
  });
}

function handleSearch(query) {
  clearSelection();
  const q=query.trim().toLowerCase();
  document.querySelectorAll('.course-card').forEach(card=>{
    card.classList.remove('searched','dimmed');
    if(!q) return;
    const cid=card.dataset.id.toLowerCase();
    const name=courseMap[card.dataset.id]?.name.toLowerCase()||'';
    if(cid.includes(q)||name.includes(q)) card.classList.add('searched');
    else card.classList.add('dimmed');
  });
}

document.addEventListener('keydown',e=>{if(e.key==='Escape') clearSelection();});
let isDragging=false,dragStart={};
outer.addEventListener('mousedown',e=>{
  if(e.target.closest('.course-card')) return;
  isDragging=true; dragStart={x:e.clientX,scrollLeft:outer.scrollLeft};
  outer.style.cursor='grabbing';
});
document.addEventListener('mousemove',e=>{if(isDragging) outer.scrollLeft=dragStart.scrollLeft-(e.clientX-dragStart.x);});
document.addEventListener('mouseup',()=>{isDragging=false;outer.style.cursor='';});
</script>
